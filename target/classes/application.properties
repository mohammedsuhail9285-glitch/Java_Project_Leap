# ===================================================================
# AUTOMATED COLD-CHAIN LOGISTICS & TEMPERATURE COMPLIANCE TRACKER
# Application Configuration
# ===================================================================

spring.application.name=cold-chain-tracker
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/coldchain_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Cold-Chain Compliance Business Rules (Safe range: 2.0°C to 8.0°C)
# -------------------------------------------------------------------
coldchain.temperature.min-safe-limit=2.0
coldchain.temperature.max-safe-limit=8.0
coldchain.temperature.min-sensor-limit=-50.0
coldchain.temperature.max-sensor-limit=60.0

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
# 256-bit Hex Key for HMAC-SHA256 signing
coldchain.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
coldchain.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# Swagger / OpenAPI Configuration
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=list

# -------------------------------------------------------------------
# Logging Configuration (SLF4J / Logback)
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.coldchain.tracker=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
